name: GitHub Draft Release
on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Name of git tag to be created, and then draft release created. Syntax: "v[0-9]+.[0-9]+.[0-9]+".'
        required: true
      from-tag-name:
        description: >-
          Name of the git tag from which to detect changes from.
          Default value: latest tag. Syntax: "v[0-9]+.[0-9]+.[0-9]+".
        required: false

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check format of received target tag
        id: check-version-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.tag-name }}

      - name: Check format of received from tag
        if: ${{ github.event.inputs.from-tag-name }}
        id: check-version-from-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.from-tag-name }}
          should-exist: true

      - name: Create and push tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ github.event.inputs.tag-name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const ref = `refs/tags/${tag}`;
            const sha = context.sha;

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              sha: sha
            });

            console.log(`Tag created: ${tag}`);
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        id: generate_release_notes
        uses: AbsaOSS/generate-release-notes@4592187ca123598c8f0bd6de06311c9f5cd8b773 # v1.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release-notes-title: "## [Rr]elease [Nn]otes"
          tag-name: ${{ github.event.inputs.tag-name }}
          from-tag-name: ${{ github.event.inputs.from-tag-name }}
          chapters: |
            - {"title": "Breaking Changes 💥", "labels": "breaking change, generic:breaking-change"}
            - {"title": "New Features 🎉", "labels": "enhancement, type:feature"}
            - {"title": "Bugfixes 🛠", "labels": "bug, type:bug"}
            - {"title": "Security updates 👮", "labels": "security, scope:security"}
            - {"title": "Technical debt 🧹", "labels": "tech debt, type:tech-debt, refactoring"}
            - {"title": "Documentation 📜", "labels": "documentation, type:documentation"}
            - {"title": "Infrastructure ⚙️", "labels": "infrastructure, scope:devops"}
            - {"title": "Epics 📖", "labels": "epic, type:epic"}
            - {"title": "Silent-live 🤫", "label": "silent live"}
            - {"title": "Operative 🗂️", "labels": "operative, type:operative, spike, type:spike, pointer, type:pointer", "hidden": true}
            - {"title": "Entries to skip 🚫", "labels": "duplicate, generic:duplicate, invalid, wontfix, generic:wont-fix, no RN, pr:no-release-notes", "hidden": true}
          duplicity-scope: 'none'
          warnings: true
          skip-release-notes-labels: "no RN,pr:no-release-notes,duplicate,generic:duplicate,invalid,wontfix,generic:wont-fix"
          print-empty-chapters: false
          row-format-issue: '_{title}_ {developers} in {number}'
          row-format-pr: '_{title}_ {developers} in {number}'
          row-format-link-pr: true

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.event.inputs.tag-name }}
          body: ${{ steps.generate_release_notes.outputs.release-notes }}
          tag_name: ${{ github.event.inputs.tag-name }}
          draft: true
          prerelease: false
