name: "Integration Test"

on:
  pull_request:
    paths:
      - 'generator_markdown/**'
      - 'templates/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'action.yml'
      - 'tools/write_sample_inputs.py'
      - '.github/workflows/integration_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-venv-isolation:
    runs-on: ubuntu-latest
    name: Action Venv - Isolation and Reuse
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Write the inputs from the living-doc-utilities samples
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/samples-venv"
          "${RUNNER_TEMP}/samples-venv/bin/pip" install -r requirements.txt
          "${RUNNER_TEMP}/samples-venv/bin/python" tools/write_sample_inputs.py "${RUNNER_TEMP}/inputs" \
            generator-ready coverage-matrix ui-test-catalog
          rm -rf "${RUNNER_TEMP}/samples-venv"

      - name: Install a conflicting pydantic into the runner's interpreter
        run: |
          set -euo pipefail
          pip install 'pydantic<2'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/before.txt"

      - name: Run the action (first step)
        id: first
        uses: ./
        with:
          document-type: technical-project
          source-path: ${{ runner.temp }}/inputs/generator-ready.json
          output-path: ${{ github.workspace }}/output/first

      - name: Stamp the venv
        run: stat -c %Y "${RUNNER_TEMP}/living-doc-generator-markdown-venv/pyvenv.cfg" > "${RUNNER_TEMP}/venv-cfg-mtime.txt"

      - name: Run the action (second step)
        id: second
        uses: ./
        with:
          document-type: coverage-matrix
          source-path: ${{ runner.temp }}/inputs/coverage-matrix.json
          output-path: ${{ github.workspace }}/output/second

      - name: Run the action (third step)
        id: third
        uses: ./
        with:
          document-type: ui-test-catalog
          source-path: ${{ runner.temp }}/inputs/ui-test-catalog.json
          output-path: ${{ github.workspace }}/output/third
          document-title: Checkout tests

      - name: Every step rendered its document, the venv was reused, the caller's environment is unchanged
        env:
          VENV: ${{ runner.temp }}/living-doc-generator-markdown-venv
          FIRST: ${{ steps.first.outputs.output-path }}
          SECOND: ${{ steps.second.outputs.output-path }}
          THIRD: ${{ steps.third.outputs.output-path }}
        run: |
          set -euo pipefail
          test "$FIRST" = "${{ github.workspace }}/output/first"
          test "$SECOND" = "${{ github.workspace }}/output/second"
          test "$THIRD" = "${{ github.workspace }}/output/third"
          rendered() {
            ls "$1"
            test "$(ls "$1" | sort | tr '\n' ' ')" = "$2.md $2.run-report.json "
            head -n 1 "$1/$2.md"
            jq -e --arg type "$2" '.document_type == $type and .document == ($type + ".md") and .view == "inner"
              and .render_manifest.view == "inner"' "$1/$2.run-report.json"
          }
          rendered "$FIRST" technical-project
          rendered "$SECOND" coverage-matrix
          rendered "$THIRD" ui-test-catalog
          test "$(head -n 1 "$THIRD/ui-test-catalog.md")" = '# Checkout tests'
          test "$(stat -c %Y "$VENV/pyvenv.cfg")" = "$(cat "${RUNNER_TEMP}/venv-cfg-mtime.txt")"
          replay() {
            out="${RUNNER_TEMP}/replay-$2"
            INPUT_DOCUMENT_TYPE="$1" INPUT_SOURCE_PATH="${RUNNER_TEMP}/inputs/$2.json" INPUT_OUTPUT_PATH="$out" \
              GITHUB_OUTPUT="$out.output" "$VENV/bin/python" -E main.py > "$out.log" 2>&1 || { cat "$out.log"; exit 1; }
            cat "$out.log"
            grep -F "input read: \`$2-v" "$out.log"
            jq -e --arg type "$1" --arg input "$2" '.document_type == $type and (.input.schema_version | startswith($input + "-v"))
              and (.render_manifest | has("entities") and has("acceptance_criteria") and has("aspects") and has("badges"))' \
              "$out/$1.run-report.json"
            test "$(cat "$out.output")" = "output-path=$out"
          }
          replay technical-project generator-ready
          replay coverage-matrix coverage-matrix
          replay ui-test-catalog ui-test-catalog
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/after.txt"
          diff "${RUNNER_TEMP}/before.txt" "${RUNNER_TEMP}/after.txt"
          echo '::notice::every step wrote its document and run report and set output-path, every replay wrote its run report, the venv was reused, and the runner interpreter is unchanged.'

  action-venv-rebuilt-when-python-changes:
    runs-on: ubuntu-latest
    name: Action Venv - Rebuilt When Python Changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Write the input from the living-doc-utilities samples
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/samples-venv"
          "${RUNNER_TEMP}/samples-venv/bin/pip" install -r requirements.txt
          "${RUNNER_TEMP}/samples-venv/bin/python" tools/write_sample_inputs.py "${RUNNER_TEMP}/inputs" generator-ready
          rm -rf "${RUNNER_TEMP}/samples-venv"

      - name: Run the action on 3.12
        id: on-312
        uses: ./
        with:
          document-type: technical-project
          source-path: ${{ runner.temp }}/inputs/generator-ready.json

      - name: The venv was built from 3.12, and the document written into the default output directory
        env:
          OUTPUT_PATH: ${{ steps.on-312.outputs.output-path }}
        run: |
          set -euo pipefail
          test "$OUTPUT_PATH" = "${{ github.workspace }}/output/generator-markdown"
          test -s "$OUTPUT_PATH/technical-project.md"
          test -s "$OUTPUT_PATH/technical-project.run-report.json"
          rm -r "$OUTPUT_PATH"
          "${RUNNER_TEMP}/living-doc-generator-markdown-venv/bin/python" \
            -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Switch the interpreter on PATH to 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run the action on 3.11
        id: on-311
        uses: ./
        with:
          document-type: technical-project
          source-path: ${{ runner.temp }}/inputs/generator-ready.json

      - name: The venv was rebuilt from the interpreter now on PATH
        env:
          OUTPUT_PATH: ${{ steps.on-311.outputs.output-path }}
        run: |
          set -euo pipefail
          test -s "$OUTPUT_PATH/technical-project.md"
          "${RUNNER_TEMP}/living-doc-generator-markdown-venv/bin/python" \
            -c 'import sys, living_doc_utilities; assert sys.version_info[:2] == (3, 11), sys.version'
          echo '::notice::switching the interpreter rebuilt the venv instead of reusing the 3.12 one.'

  action-rejects-python-39:
    runs-on: ubuntu-latest
    name: Action Venv - Python 3.9 Is Rejected
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 for the input
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Write the input from the living-doc-utilities samples
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/samples-venv"
          "${RUNNER_TEMP}/samples-venv/bin/pip" install -r requirements.txt
          "${RUNNER_TEMP}/samples-venv/bin/python" tools/write_sample_inputs.py "${RUNNER_TEMP}/inputs" generator-ready
          rm -rf "${RUNNER_TEMP}/samples-venv"

      - name: Set up Python 3.9
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Run the action, which must fail
        id: run-on-39
        continue-on-error: true
        uses: ./
        with:
          document-type: technical-project
          source-path: ${{ runner.temp }}/inputs/generator-ready.json

      - name: The action failed on the version check, before creating a venv
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          if [[ "${{ steps.run-on-39.outcome }}" != "failure" ]]; then
            echo "::error::the action must fail when PATH's Python is older than 3.10."; exit 1
          fi
          if [[ -d "${RUNNER_TEMP}/living-doc-generator-markdown-venv" ]]; then
            echo "::error::the action must fail the version check before it creates a venv."; exit 1
          fi
